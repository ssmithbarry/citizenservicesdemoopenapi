{
  "tools": [
    {
      "name": "createServiceRequest",
      "description": "Create a new 311 service request for issues like potholes, streetlights, noise complaints",
      "parameters": {
        "type": "object",
        "properties": {
          "requestType": {
            "type": "string",
            "description": "Type of service request",
            "enum": ["pothole", "streetlight", "noise_complaint", "water_leak", "trash_pickup", "park_maintenance", "traffic_signal", "building_permit", "animal_control", "general"]
          },
          "description": {
            "type": "string",
            "description": "Detailed description of the issue"
          },
          "location": {
            "type": "string",
            "description": "Street address or location description"
          },
          "phoneNumber": {
            "type": "string",
            "description": "Citizen's contact phone number"
          }
        },
        "required": ["requestType", "description", "location"]
      }
    },
    {
      "name": "getServiceRequestStatus",
      "description": "Look up the status of an existing service request by request ID",
      "parameters": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string",
            "description": "Service request ID (format: SR-YYYYMMDD-XXXXXXXX)"
          }
        },
        "required": ["requestId"]
      }
    },
    {
      "name": "getCitizenServiceHistory",
      "description": "Retrieve all service requests for a citizen by phone number",
      "parameters": {
        "type": "object",
        "properties": {
          "phoneNumber": {
            "type": "string",
            "description": "Citizen's phone number"
          }
        },
        "required": ["phoneNumber"]
      }
    },
    {
      "name": "lookupCitizenProfile",
      "description": "Look up citizen profile information by phone number or email",
      "parameters": {
        "type": "object",
        "properties": {
          "phoneNumber": {
            "type": "string",
            "description": "Citizen's phone number"
          },
          "email": {
            "type": "string",
            "description": "Citizen's email address"
          }
        }
      }
    },
    {
      "name": "searchKnowledgeBase",
      "description": "Search FAQ and knowledge articles for citizen questions",
      "parameters": {
        "type": "object",
        "properties": {
          "query": {
            "type": "string",
            "description": "Search query for knowledge base"
          },
          "category": {
            "type": "string",
            "description": "Optional category filter"
          }
        },
        "required": ["query"]
      }
    }
  ]
}